<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020917" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="48%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#c8956c"/>
      <stop offset="100%" stop-color="#9a6540"/>
    </radialGradient>
    <radialGradient id="shirtGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#081224"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <clipPath id="cc">
      <circle cx="200" cy="200" r="196"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>

  <g clip-path="url(#cc)">
    <!-- SHIRT / BODY -->
    <ellipse cx="200" cy="390" rx="155" ry="105" fill="url(#shirtGrad)"/>
    <ellipse cx="200" cy="368" rx="130" ry="90" fill="#0f1f3d"/>
    <!-- Collar -->
    <path d="M172 292 Q200 308 228 292 L242 345 Q200 358 158 345 Z" fill="#1a3055"/>
    <!-- Tie/shirt line -->
    <path d="M196 308 L200 355 L204 308" fill="#0d1e38"/>

    <!-- NECK -->
    <rect x="185" y="255" width="30" height="50" rx="15" fill="#b8845a"/>

    <!-- HEAD -->
    <ellipse cx="200" cy="198" rx="80" ry="87" fill="url(#skinGrad)"/>

    <!-- EAR LEFT -->
    <ellipse cx="122" cy="205" rx="13" ry="20" fill="#b8845a"/>
    <ellipse cx="125" cy="205" rx="7" ry="13" fill="#9a6540"/>
    <!-- EAR RIGHT -->
    <ellipse cx="278" cy="205" rx="13" ry="20" fill="#b8845a"/>
    <ellipse cx="275" cy="205" rx="7" ry="13" fill="#9a6540"/>

    <!-- HAIR -->
    <ellipse cx="200" cy="145" rx="82" ry="56" fill="#130c07"/>
    <ellipse cx="200" cy="126" rx="76" ry="42" fill="#1a0f0a"/>
    <ellipse cx="155" cy="158" rx="32" ry="35" fill="#130c07"/>
    <ellipse cx="245" cy="158" rx="32" ry="35" fill="#130c07"/>
    <ellipse cx="200" cy="122" rx="60" ry="28" fill="#0d0905"/>
    <!-- Hair fade at temples -->
    <ellipse cx="136" cy="178" rx="20" ry="28" fill="#130c07"/>
    <ellipse cx="264" cy="178" rx="20" ry="28" fill="#130c07"/>

    <!-- EYEBROWS -->
    <path d="M155 180 Q172 171 191 177" stroke="#130c07" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M209 177 Q228 171 245 180" stroke="#130c07" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- EYES WHITE -->
    <ellipse cx="173" cy="196" rx="15" ry="13" fill="white"/>
    <ellipse cx="227" cy="196" rx="15" ry="13" fill="white"/>
    <!-- IRIS -->
    <ellipse cx="174" cy="198" rx="10" ry="10" fill="#2a1505"/>
    <ellipse cx="226" cy="198" rx="10" ry="10" fill="#2a1505"/>
    <!-- PUPIL -->
    <ellipse cx="174" cy="197" rx="6" ry="6" fill="#080604"/>
    <ellipse cx="226" cy="197" rx="6" ry="6" fill="#080604"/>
    <!-- SHINE -->
    <ellipse cx="178" cy="193" rx="3" ry="2.5" fill="white" opacity="0.85"/>
    <ellipse cx="230" cy="193" rx="3" ry="2.5" fill="white" opacity="0.85"/>
    <!-- Lower eyelid -->
    <path d="M160 200 Q173 208 186 200" stroke="#9a7060" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M214 200 Q227 208 240 200" stroke="#9a7060" stroke-width="1" fill="none" opacity="0.5"/>

    <!-- NOSE -->
    <path d="M196 212 C193 225 188 232 186 237 Q200 244 214 237 C212 232 207 225 204 212" fill="#9a6540" opacity="0.55"/>
    <ellipse cx="191" cy="236" rx="7" ry="5" fill="#7a4a28" opacity="0.4"/>
    <ellipse cx="209" cy="236" rx="7" ry="5" fill="#7a4a28" opacity="0.4"/>

    <!-- MOUTH -->
    <path d="M179 255 Q200 270 221 255" stroke="#8a5030" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M182 257 Q200 268 218 257" fill="#c26b50" opacity="0.4"/>
    <!-- Upper lip -->
    <path d="M185 252 Q192 248 200 250 Q208 248 215 252" stroke="#8a5030" stroke-width="1.5" fill="none"/>

    <!-- CHIN / JAW SHADOW -->
    <ellipse cx="200" cy="272" rx="44" ry="14" fill="#7a5030" opacity="0.2"/>

    <!-- CHEEK GLOW (subtle blue-sky reflection) -->
    <ellipse cx="148" cy="215" rx="22" ry="16" fill="#38bdf8" opacity="0.06"/>
    <ellipse cx="252" cy="215" rx="22" ry="16" fill="#38bdf8" opacity="0.06"/>
  </g>

  <!-- GLOW OVERLAY -->
  <circle cx="200" cy="200" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="16 10"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#ringGrad)" stroke-width="1" stroke-opacity="0.2"/>
</svg>
